[workspace]
members = [
    "crates/omc-cap",
    "crates/omc-cli",
    "crates/omc-demo",
    "crates/omc-format",
    "crates/omc-frontend-js",
    "crates/omc-frontend-py",
    "crates/omc-linker",
    "crates/omc-registry",
    "crates/omc-runtime",
    "crates/omc-taint",
    "crates/omc-verify",
    "crates/omc-vm",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.2.0"
repository = "https://github.com/turenio/omc"
homepage = "https://github.com/turenio/omc"

# Optimized release profile for shipped binaries: smaller, faster, stripped.
[profile.release]
opt-level = 3
lto = "thin"
strip = true
