name: Release

# Builds the per-platform binaries and publishes the GitHub Release. The Homebrew
# formula lives in the turenlabs/homebrew-tap repo and is bumped there per release
# (see that repo's bump.sh); this workflow never touches the tap — no tap token.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v0.1.0)"
        required: true
      dry_run:
        description: "Build and package only; skip publishing the GitHub Release"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

# Least privilege by default; only the publish job below opts into contents:write.
permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS targets build on macos-latest (Apple Silicon). The
          # x86_64 build cross-compiles there — omc is pure-Rust (reqwest uses
          # rustls-tls, no system libs), and the toolchain step installs the
          # x86_64 std target, so cross-compilation is clean. macos-13 (the EOL
          # Intel runner) never got allocated and hung every release.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Native arm64 Linux build on the GitHub-hosted arm runner (Docker on
          # Apple Silicon, Graviton, Raspberry Pi).
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Fully static musl builds (no glibc) for Alpine and FROM-scratch
          # containers. Pure-Rust deps + ring, so musl-gcc is all they need.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${ref}" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: ${{ matrix.musl }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build release binaries
        run: cargo build --release --locked --package omc-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: ./scripts/package-release.sh "${{ steps.version.outputs.version }}" "${{ matrix.target }}"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-${{ matrix.target }}
          # The whole dist dir: the tarball (omc + shims), the standalone `omc`
          # single binary, and their .sha256 sidecars.
          path: dist/

  release:
    name: publish release
    needs: build
    # Skipped on a dry-run dispatch: the matrix still builds and packages every
    # target, but nothing is published. Use this to validate matrix changes
    # before tagging.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${ref}" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksums
        shell: bash
        run: |
          cd dist
          # Hash every distributable (tarballs + standalone binaries), excluding
          # the per-file .sha256 sidecars and SHA256SUMS itself.
          assets=$(ls | grep -vE '\.sha256$|^SHA256SUMS$')
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum $assets > SHA256SUMS
          else
            shasum -a 256 $assets > SHA256SUMS
          fi
          cat SHA256SUMS
      - name: Extract changelog for this version
        shell: bash
        run: |
          ver="${{ steps.version.outputs.version }}"
          # Pull the "## [<version>]" section from CHANGELOG.md (up to the next
          # "## [" header) for the release body; action-gh-release appends the
          # auto-generated commit notes after it. Missing section => empty body
          # (degrades to the auto notes), never a failed release.
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "--- release notes ---"; cat RELEASE_NOTES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: omc ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          # Tarballs (omc + shims), standalone `omc-<target>` single binaries,
          # their .sha256 sidecars, and the combined SHA256SUMS.
          files: dist/*
