name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS targets build on macos-latest (Apple Silicon). The
          # x86_64 build cross-compiles there — omc is pure-Rust (reqwest uses
          # rustls-tls, no system libs), and the toolchain step installs the
          # x86_64 std target, so cross-compilation is clean. macos-13 (the EOL
          # Intel runner) never got allocated and hung every release.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${ref}" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --locked --package omc-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: ./scripts/package-release.sh "${{ steps.version.outputs.version }}" "${{ matrix.target }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          # The whole dist dir: the tarball (omc + shims), the standalone `omc`
          # single binary, and their .sha256 sidecars.
          path: dist/

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${ref}" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksums
        shell: bash
        run: |
          cd dist
          # Hash every distributable (tarballs + standalone binaries), excluding
          # the per-file .sha256 sidecars and SHA256SUMS itself.
          assets=$(ls | grep -vE '\.sha256$|^SHA256SUMS$')
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum $assets > SHA256SUMS
          else
            shasum -a 256 $assets > SHA256SUMS
          fi
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: omc ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          # Tarballs (omc + shims), standalone `omc-<target>` single binaries,
          # their .sha256 sidecars, and the combined SHA256SUMS.
          files: dist/*

  update-homebrew:
    name: update homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${ref}" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
      - name: Bump and publish formula
        env:
          # Optional: a PAT with write access to the tap repo. The step no-ops
          # (logs and exits 0) when the secret is absent, so releases never fail
          # just because the tap is not yet configured.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Tap repo in `owner/repo` form, e.g. turenio/homebrew-tap.
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: ./scripts/update-homebrew-formula.sh
