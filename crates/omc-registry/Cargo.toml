[package]
name = "omc-registry"
description = "Registry, cache, lockfile, and package profiling for OMC"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
base64 = "0.22"
flate2 = "1"
hex = "0.4"
omc-cap = { path = "../omc-cap" }
omc-format = { path = "../omc-format" }
omc-verify = { path = "../omc-verify" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
toml = "0.8"
urlencoding = "2"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
