[package]
name = "omc-cli"
description = "OMC package-manager prototype CLI"
edition.workspace = true
license.workspace = true
version.workspace = true
autobins = false

[[bin]]
name = "omc"
path = "src/main.rs"
test = false

[features]
default = []
dev-commands = []

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
omc-cap = { path = "../omc-cap" }
omc-format = { path = "../omc-format" }
omc-frontend-js = { path = "../omc-frontend-js" }
omc-frontend-py = { path = "../omc-frontend-py" }
omc-policy = { path = "../omc-policy" }
omc-registry = { path = "../omc-registry" }
omc-runtime = { path = "../omc-runtime" }
omc-taint = { path = "../omc-taint" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
tiny-skia = "0.12"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
